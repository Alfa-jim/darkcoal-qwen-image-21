name: Test, build and publish Qwen 2.1 Q4

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.3.0
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q handler.py worker scripts tests
      - run: python scripts/make_download_command.py --check

  container:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Container metadata
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and CPU smoke test
        uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: qwen21:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check final runtime without models
        run: docker run --rm --entrypoint python qwen21:ci scripts/smoke.py
      - name: Publish tested image
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          docker tag qwen21:ci "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:sha-$GITHUB_SHA"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            docker tag qwen21:ci "$IMAGE:latest"
            docker push "$IMAGE:latest"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            docker tag qwen21:ci "$IMAGE:$GITHUB_REF_NAME"
            docker push "$IMAGE:$GITHUB_REF_NAME"
          fi
          docker inspect --format '{{json .RepoDigests}}' "$IMAGE:sha-$GITHUB_SHA" | tee image-digests.json
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: image-digests
          path: image-digests.json
